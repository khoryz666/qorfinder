[package]
name = "qf-core"
description = "QorFinder library: ingest, chunk, embed, store and search local legal documents"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
docx-rs = "0.4"
pdf-extract = "0.12"
rayon = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
thiserror.workspace = true
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
unicode-normalization = "0.1"
walkdir = "2"

[dev-dependencies]
# Builds the test PDFs; the same lopdf version pdf-extract uses.
lopdf = "0.42"
tempfile = "3"
