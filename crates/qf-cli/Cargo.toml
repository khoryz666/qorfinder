[package]
name = "qf-cli"
description = "QorFinder command line: index, search, eval and serve"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "qorfinder"
path = "src/main.rs"

[dependencies]
qf-core.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
indicatif = "0.18"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.7", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
opener = "0.9"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
thiserror.workspace = true
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
