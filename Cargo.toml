[package]
name = "qorfinder"
version = "0.1.0"
edition = "2024"
description = "Local-first semantic search CLI: index files into Qdrant, query with sentence embeddings"
license = "MIT"

[lib]
name = "qorfinder"
path = "src/lib.rs"

[[bin]]
name = "qorfinder"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
docx-rs = "0.4"
dirs = "6"
dunce = "1"
fastembed = "4"
lopdf = "0.36"
md-5 = "0.10"
notify = "8"
qdrant-client = "1"
rayon = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "2"
uuid = { version = "1", features = ["v5"] }
walkdir = "2"
zip = "8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
