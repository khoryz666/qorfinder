name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    name: linux
    # Pinned, not ubuntu-latest: the binary needs a glibc at least as new as
    # the build image's, and Ubuntu 24.04 (glibc 2.39) is what Linux Mint 22
    # is based on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Built with the runner's rustup (it reads rust-toolchain.toml), not in
      # the Nix shell: a binary linked there loads Nix's own ld-linux and
      # would not start on a Linux machine without Nix.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build release binary
        run: cargo build --release

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.7"

      - name: Fetch the model
        run: python scripts/fetch_model.py
        env:
          QF_MODELS: ft,minilm

      # Nothing ships that fails the tests; --release reuses the build above.
      - name: Test
        run: cargo test --release --workspace -- --include-ignored

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0

      - name: Build the UI
        run: npm ci && npm run build
        working-directory: ui

      - name: Collect the Rust libraries' licences
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: cargo-about

      - name: Write THIRD_PARTY_LICENSES.html
        run: cargo about generate about.hbs -o THIRD_PARTY_LICENSES.html

      # The executable looks for models/<name> and the built UI
      # (ui/) next to itself, so the zip unpacks into a folder that runs as
      # it is.
      - name: Package
        run: |
          pkg=dist/qorfinder
          mkdir -p "$pkg/models"
          cp target/release/qorfinder LICENSE THIRD_PARTY_LICENSES.html "$pkg/"
          cp -r models/all-MiniLM-L6-v2 models/all-MiniLM-L6-v2-ft-cuad "$pkg/models/"
          cp -r ui/dist "$pkg/ui"
          cp licenses/all-MiniLM-L6-v2.txt "$pkg/models/all-MiniLM-L6-v2/LICENSE"
          cp licenses/all-MiniLM-L6-v2-ft-cuad.txt "$pkg/models/all-MiniLM-L6-v2-ft-cuad/LICENSE"
          cd dist && zip -r "qorfinder-${{ github.ref_name }}-linux-x86_64.zip" qorfinder

      - name: Upload release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/qorfinder-${{ github.ref_name }}-linux-x86_64.zip
          generate_release_notes: true

  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build release binary
        run: cargo build --release

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.7"

      - name: Fetch the model
        run: python scripts/fetch_model.py
        env:
          QF_MODELS: ft,minilm

      # Nothing ships that fails the tests; --release reuses the build above.
      - name: Test
        run: cargo test --release --workspace -- --include-ignored

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0

      - name: Build the UI
        run: npm ci && npm run build
        working-directory: ui

      - name: Collect the Rust libraries' licences
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: cargo-about

      - name: Write THIRD_PARTY_LICENSES.html
        run: cargo about generate about.hbs -o THIRD_PARTY_LICENSES.html

      - name: Package
        run: |
          $pkg = "dist/qorfinder"
          New-Item -ItemType Directory -Force "$pkg/models" | Out-Null
          Copy-Item target/release/qorfinder.exe, LICENSE, THIRD_PARTY_LICENSES.html "$pkg/"
          Copy-Item -Recurse models/all-MiniLM-L6-v2, models/all-MiniLM-L6-v2-ft-cuad "$pkg/models/"
          Copy-Item -Recurse ui/dist "$pkg/ui"
          Copy-Item licenses/all-MiniLM-L6-v2.txt "$pkg/models/all-MiniLM-L6-v2/LICENSE"
          Copy-Item licenses/all-MiniLM-L6-v2-ft-cuad.txt "$pkg/models/all-MiniLM-L6-v2-ft-cuad/LICENSE"
          Compress-Archive -Path $pkg -DestinationPath "dist/qorfinder-${{ github.ref_name }}-windows-x86_64.zip"

      - name: Upload release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/qorfinder-${{ github.ref_name }}-windows-x86_64.zip
