name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    name: linux
    # Pinned, not ubuntu-latest: the binary needs a glibc at least as new as
    # the build image's, and Ubuntu 24.04 (glibc 2.39) is what Linux Mint 22
    # is based on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Built with the runner's rustup (it reads rust-toolchain.toml), not in
      # the Nix shell: a binary linked there loads Nix's own ld-linux and
      # would not start on a Linux machine without Nix.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Fetch the model
        run: python3 scripts/fetch_model.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the UI
        run: npm ci && npm run build
        working-directory: ui

      - name: Collect the Rust libraries' licences
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Write THIRD_PARTY_LICENSES.html
        run: cargo about generate about.hbs -o THIRD_PARTY_LICENSES.html

      # The executable looks for models/all-MiniLM-L6-v2 and the built UI
      # (ui/) next to itself, so the zip unpacks into a folder that runs as
      # it is.
      - name: Package
        run: |
          pkg=dist/qorfinder
          mkdir -p "$pkg/models"
          cp target/release/qorfinder LICENSE THIRD_PARTY_LICENSES.html "$pkg/"
          cp -r models/all-MiniLM-L6-v2 "$pkg/models/"
          cp -r ui/dist "$pkg/ui"
          cp licenses/all-MiniLM-L6-v2.txt "$pkg/models/all-MiniLM-L6-v2/LICENSE"
          cd dist && zip -r "qorfinder-${{ github.ref_name }}-linux-x86_64.zip" qorfinder

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/qorfinder-${{ github.ref_name }}-linux-x86_64.zip
          generate_release_notes: true

  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Fetch the model
        run: python scripts/fetch_model.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the UI
        run: npm ci && npm run build
        working-directory: ui

      - name: Collect the Rust libraries' licences
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Write THIRD_PARTY_LICENSES.html
        run: cargo about generate about.hbs -o THIRD_PARTY_LICENSES.html

      - name: Package
        run: |
          $pkg = "dist/qorfinder"
          New-Item -ItemType Directory -Force "$pkg/models" | Out-Null
          Copy-Item target/release/qorfinder.exe, LICENSE, THIRD_PARTY_LICENSES.html "$pkg/"
          Copy-Item -Recurse models/all-MiniLM-L6-v2 "$pkg/models/"
          Copy-Item -Recurse ui/dist "$pkg/ui"
          Copy-Item licenses/all-MiniLM-L6-v2.txt "$pkg/models/all-MiniLM-L6-v2/LICENSE"
          Compress-Archive -Path $pkg -DestinationPath "dist/qorfinder-${{ github.ref_name }}-windows-x86_64.zip"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/qorfinder-${{ github.ref_name }}-windows-x86_64.zip
