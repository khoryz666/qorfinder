name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Both jobs run the same checks in the same order: formatting, lint,
# release build, the tests (with the model), the scoring check and the UI
# build. Linux takes every tool from the flake; Windows has no Nix, so it
# takes the same versions from rust-toolchain.toml, requirements.txt and the
# Node.js and Python versions pinned below, which are the flake's.
jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # --ignore-environment hides the runner's own cargo, Node and Python,
      # so a tool missing from the flake fails here instead of being found
      # on the runner's PATH (test case T13).
      - name: Check formatting
        run: nix develop --ignore-environment --keep HOME --command cargo fmt --all -- --check

      - name: Lint
        run: nix develop --ignore-environment --keep HOME --command cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (release)
        run: nix develop --ignore-environment --keep HOME --command cargo build --release

      # The model is pinned by revision and SHA-256 in fetch_model.py, so the
      # cache key changes exactly when the model does.
      - name: Cache the model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: models
          key: model-${{ hashFiles('scripts/fetch_model.py') }}

      - name: Fetch the model
        run: nix develop --ignore-environment --keep HOME --keep QF_MODELS --command python3 scripts/fetch_model.py
        env:
          QF_MODELS: minilm

      # --include-ignored also runs the tests that load the model, among them
      # the check against sentence-transformers quoted in the report.
      - name: Test
        run: nix develop --ignore-environment --keep HOME --command cargo test --workspace -- --include-ignored

      - name: Check the scoring script
        run: nix develop --ignore-environment --keep HOME --command python3 scripts/score.py

      # requirements*.txt must be what the flake generates, so they cannot drift.
      - name: Check requirements*.txt match the flake
        run: |
          nix build .#requirements
          diff -u result/requirements.txt requirements.txt
          diff -u result/requirements-finetune.txt requirements-finetune.txt

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.7"

      # The pip path, the same on both OSes: requirements.txt is every package
      # of the flake's scoring shell, installed as it is with --no-deps.
      - name: Install the locked scoring packages
        run: python -m pip install --no-deps -r requirements.txt

      - name: Check the installed packages are exactly the lock
        shell: python
        run: |
          import subprocess, sys
          def norm(n): return n.strip().lower().replace("_", "-").replace(".", "-")
          lock = dict(l.split("#")[0].strip().split("==") for l in open("requirements.txt") if l.split("#")[0].strip())
          lock = {norm(n): v for n, v in lock.items()}
          out = subprocess.run([sys.executable, "-m", "pip", "freeze"], capture_output=True, text=True, check=True).stdout
          got = {norm(n): v for n, v in (l.split("==") for l in out.splitlines() if "==" in l)}
          if got != lock:
              sys.exit(f"pip freeze differs from requirements.txt: {sorted(set(got.items()) ^ set(lock.items()))}")
          check = subprocess.run([sys.executable, "-m", "pip", "check"], capture_output=True, text=True).stdout
          # ranx never needs ir-datasets (flake.nix); tqdm needs colorama only on Windows, imports it
          # optionally, and the Linux-built lock leaves it out.
          allowed = ("requires ir-datasets, which is not installed", "requires colorama, which is not installed")
          extra = [l for l in check.splitlines() if l.strip() and not any(a in l for a in allowed)]
          if extra:
              sys.exit("pip check: " + "; ".join(extra))
          print(f"{len(got)} packages, exactly requirements.txt")

      # The self-check scores a hand-worked run with ranx and scipy; the run
      # files of results/eval are not in the repository.
      - name: Check the scoring script (pip)
        run: python scripts/score.py

      - name: Check requirements-finetune.txt installs
        run: python -m pip install --no-deps --dry-run -r requirements-finetune.txt

      - name: Type-check and build the UI
        run: nix develop --ignore-environment --keep HOME --command sh -c "cd ui && npm ci && npm run build"

  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # rustup is preinstalled on the runner and picks up rust-toolchain.toml,
      # with its rustfmt and clippy.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --release

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.7"

      - name: Cache the model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: models
          key: model-${{ hashFiles('scripts/fetch_model.py') }}

      - name: Fetch the model
        run: python scripts/fetch_model.py
        env:
          QF_MODELS: minilm

      - name: Test
        run: cargo test --workspace -- --include-ignored

      # The versions in requirements.txt; ranx without ir_datasets, as in
      # flake.nix.
      # The pip path, the same on both OSes: requirements.txt is every package
      # of the flake's scoring shell, installed as it is with --no-deps.
      - name: Install the locked scoring packages
        run: python -m pip install --no-deps -r requirements.txt

      - name: Check the installed packages are exactly the lock
        shell: python
        run: |
          import subprocess, sys
          def norm(n): return n.strip().lower().replace("_", "-").replace(".", "-")
          lock = dict(l.split("#")[0].strip().split("==") for l in open("requirements.txt") if l.split("#")[0].strip())
          lock = {norm(n): v for n, v in lock.items()}
          out = subprocess.run([sys.executable, "-m", "pip", "freeze"], capture_output=True, text=True, check=True).stdout
          got = {norm(n): v for n, v in (l.split("==") for l in out.splitlines() if "==" in l)}
          if got != lock:
              sys.exit(f"pip freeze differs from requirements.txt: {sorted(set(got.items()) ^ set(lock.items()))}")
          check = subprocess.run([sys.executable, "-m", "pip", "check"], capture_output=True, text=True).stdout
          # ranx never needs ir-datasets (flake.nix); tqdm needs colorama only on Windows, imports it
          # optionally, and the Linux-built lock leaves it out.
          allowed = ("requires ir-datasets, which is not installed", "requires colorama, which is not installed")
          extra = [l for l in check.splitlines() if l.strip() and not any(a in l for a in allowed)]
          if extra:
              sys.exit("pip check: " + "; ".join(extra))
          print(f"{len(got)} packages, exactly requirements.txt")

      # The self-check scores a hand-worked run with ranx and scipy; the run
      # files of results/eval are not in the repository.
      - name: Check the scoring script (pip)
        run: python scripts/score.py

      - name: Check requirements-finetune.txt installs
        run: python -m pip install --no-deps --dry-run -r requirements-finetune.txt


      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0

      - name: Type-check and build the UI
        run: npm ci && npm run build
        working-directory: ui
