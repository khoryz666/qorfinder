name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # --ignore-environment hides the runner's own cargo, Node and Python,
      # so a tool missing from the flake fails here instead of being found
      # on the runner's PATH (test case T14).
      - name: Check formatting
        run: nix develop --ignore-environment --keep HOME --command cargo fmt --all -- --check

      - name: Lint
        run: nix develop --ignore-environment --keep HOME --command cargo clippy --workspace --all-targets -- -D warnings

      # Tests that need the model files under models/ are #[ignore]d, so
      # this stays offline and fast.
      - name: Test
        run: nix develop --ignore-environment --keep HOME --command cargo test --workspace

      - name: Check the scoring tools
        run: nix develop --ignore-environment --keep HOME --command python3 -c "import ranx, scipy"

  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rustup is preinstalled on the runner and picks up rust-toolchain.toml.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release

      - name: Test
        run: cargo test --workspace
