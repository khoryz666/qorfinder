name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Both jobs run the same checks in the same order: formatting, lint,
# release build, the tests (with the model), the scoring check and the UI
# build. Linux takes every tool from the flake; Windows has no Nix, so it
# takes the same versions from rust-toolchain.toml, requirements.txt and the
# Node.js and Python versions pinned below, which are the flake's.
jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # --ignore-environment hides the runner's own cargo, Node and Python,
      # so a tool missing from the flake fails here instead of being found
      # on the runner's PATH (test case T13).
      - name: Check formatting
        run: nix develop --ignore-environment --keep HOME --command cargo fmt --all -- --check

      - name: Lint
        run: nix develop --ignore-environment --keep HOME --command cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (release)
        run: nix develop --ignore-environment --keep HOME --command cargo build --release

      # The model is pinned by revision and SHA-256 in fetch_model.py, so the
      # cache key changes exactly when the model does.
      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: models
          key: model-${{ hashFiles('scripts/fetch_model.py') }}

      - name: Fetch the model
        run: nix develop --ignore-environment --keep HOME --keep QF_MODELS --command python3 scripts/fetch_model.py
        env:
          QF_MODELS: minilm

      # --include-ignored also runs the tests that load the model, among them
      # the check against sentence-transformers quoted in the report.
      - name: Test
        run: nix develop --ignore-environment --keep HOME --command cargo test --workspace -- --include-ignored

      - name: Check the scoring script
        run: nix develop --ignore-environment --keep HOME --command python3 scripts/score.py

      - name: Type-check and build the UI
        run: nix develop --ignore-environment --keep HOME --command sh -c "cd ui && npm ci && npm run build"

  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rustup is preinstalled on the runner and picks up rust-toolchain.toml,
      # with its rustfmt and clippy.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"

      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: models
          key: model-${{ hashFiles('scripts/fetch_model.py') }}

      - name: Fetch the model
        run: python scripts/fetch_model.py
        env:
          QF_MODELS: minilm

      - name: Test
        run: cargo test --workspace -- --include-ignored

      # The versions in requirements.txt; ranx without ir_datasets, as in
      # flake.nix.
      - name: Install the scoring packages
        shell: pwsh
        run: ./tools/install-scoring.ps1

      - name: Check the scoring script
        run: python scripts/score.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Type-check and build the UI
        run: npm ci && npm run build
        working-directory: ui
