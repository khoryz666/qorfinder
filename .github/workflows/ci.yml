name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # --ignore-environment hides the runner's own cargo, Node and Python,
      # so a tool missing from the flake fails here instead of being found
      # on the runner's PATH (test case T14).
      - name: Check formatting
        run: nix develop --ignore-environment --keep HOME --command cargo fmt --all -- --check

      # The model is pinned by revision and SHA-256 in fetch_model.py, so the
      # cache key changes exactly when the model does.
      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: models
          key: model-${{ hashFiles('scripts/fetch_model.py') }}

      - name: Lint
        run: nix develop --ignore-environment --keep HOME --command cargo clippy --workspace --all-targets -- -D warnings

      - name: Fetch the model
        run: nix develop --ignore-environment --keep HOME --command python3 scripts/fetch_model.py

      # --include-ignored also runs the tests that load the model, among them
      # the check against sentence-transformers quoted in the report.
      - name: Test
        run: nix develop --ignore-environment --keep HOME --command cargo test --workspace -- --include-ignored

      - name: Check the scoring tools
        run: nix develop --ignore-environment --keep HOME --command python3 -c "import ranx, scipy"

  windows:
    name: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rustup is preinstalled on the runner and picks up rust-toolchain.toml.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # The model is pinned by revision and SHA-256 in fetch_model.py, so the
      # cache key changes exactly when the model does.
      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: models
          key: model-${{ hashFiles('scripts/fetch_model.py') }}

      - name: Build (release)
        run: cargo build --release

      - name: Fetch the model
        run: python scripts/fetch_model.py

      - name: Test
        run: cargo test --workspace -- --include-ignored
